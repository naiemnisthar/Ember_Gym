<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ember Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FF5F1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-column phone app, puffy clay cards on a warm clay ground, fixed bottom tab bar, full-screen session sheet. */
:root {
  --bg: #ECE2DC;
  --surface: #F3EAE4;
  --raise: #FAF4EF;
  --ink: #2B1E19;
  --muted: #7B6359;
  --accent: #FF5A1A;
  --accent-2: #FF8E3C;
  --on-accent: #FFFFFF;
  --ok: #17A85C;
  --ok-soft: #D3F1DF;
  --danger: #D9363B;
  --track: #E1D3CB;
  --sh-dark: rgba(146, 100, 80, .34);
  --sh-light: rgba(255, 255, 255, .92);
  --in-dark: rgba(146, 100, 80, .20);
  --in-light: rgba(255, 255, 255, .80);
  --glow: rgba(255, 90, 26, .38);
  --btn-hi: rgba(255, 255, 255, .45);
  --btn-lo: rgba(120, 30, 0, .22);
  --scrim: rgba(43, 30, 25, .42);
  --veil: rgba(243, 234, 228, .86);
  --font-display: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg: 30px;
  --r-md: 22px;
  --r-sm: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1917; --surface: #29211E; --raise: #322824; --ink: #F7EDE7; --muted: #B59D92;
    --accent: #FF6424; --accent-2: #FF9547; --on-accent: #1D0D05; --ok: #35D27D; --ok-soft: #1E3A2A;
    --danger: #FF5A5E; --track: #3A2E2A;
    --sh-dark: rgba(0, 0, 0, .58); --sh-light: rgba(255, 220, 200, .05);
    --in-dark: rgba(0, 0, 0, .38); --in-light: rgba(255, 220, 200, .07);
    --glow: rgba(255, 100, 36, .30); --btn-hi: rgba(255, 255, 255, .35); --btn-lo: rgba(90, 20, 0, .35);
    --scrim: rgba(0, 0, 0, .6); --veil: rgba(41, 33, 30, .88);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1917; --surface: #29211E; --raise: #322824; --ink: #F7EDE7; --muted: #B59D92;
  --accent: #FF6424; --accent-2: #FF9547; --on-accent: #1D0D05; --ok: #35D27D; --ok-soft: #1E3A2A;
  --danger: #FF5A5E; --track: #3A2E2A;
  --sh-dark: rgba(0, 0, 0, .58); --sh-light: rgba(255, 220, 200, .05);
  --in-dark: rgba(0, 0, 0, .38); --in-light: rgba(255, 220, 200, .07);
  --glow: rgba(255, 100, 36, .30); --btn-hi: rgba(255, 255, 255, .35); --btn-lo: rgba(90, 20, 0, .35);
  --scrim: rgba(0, 0, 0, .6); --veil: rgba(41, 33, 30, .88);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.num, .tab-num { font-variant-numeric: tabular-nums; }

/* clay primitives */
.clay {
  background: var(--surface); border-radius: var(--r-lg);
  box-shadow: 9px 11px 22px var(--sh-dark), -7px -7px 16px var(--sh-light),
    inset -5px -6px 12px var(--in-dark), inset 5px 5px 10px var(--in-light);
}
.pit {
  background: var(--bg); border-radius: var(--r-sm);
  box-shadow: inset 4px 4px 9px var(--in-dark), inset -4px -4px 9px var(--in-light);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px; border-radius: 999px; font-weight: 800; letter-spacing: .01em;
  background: var(--surface); color: var(--ink);
  box-shadow: 5px 6px 12px var(--sh-dark), -4px -4px 10px var(--sh-light),
    inset -3px -3px 6px var(--in-dark), inset 3px 3px 6px var(--in-light);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:active { transform: scale(.97); box-shadow: inset 4px 4px 9px var(--in-dark), inset -4px -4px 9px var(--in-light); }
.btn.hot {
  color: var(--on-accent);
  background: linear-gradient(150deg, var(--accent-2), var(--accent) 70%);
  box-shadow: 6px 9px 18px var(--glow), -4px -4px 10px var(--sh-light),
    inset -4px -5px 9px var(--btn-lo), inset 4px 4px 9px var(--btn-hi);
}
.btn.hot:active { box-shadow: inset 5px 5px 10px var(--btn-lo), inset -3px -3px 8px var(--btn-hi); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.ghost { box-shadow: none; background: transparent; color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  background: var(--surface); font-weight: 800; font-size: 18px; line-height: 1;
  box-shadow: 3px 4px 8px var(--sh-dark), -3px -3px 7px var(--sh-light), inset -2px -2px 4px var(--in-dark), inset 2px 2px 4px var(--in-light);
}
.icon-btn:active { box-shadow: inset 3px 3px 6px var(--in-dark), inset -3px -3px 6px var(--in-light); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  background: var(--bg); color: var(--muted);
  box-shadow: inset 2px 2px 5px var(--in-dark), inset -2px -2px 5px var(--in-light);
}
.chip.hot { color: var(--on-accent); background: var(--accent); box-shadow: inset -2px -2px 5px var(--btn-lo), inset 2px 2px 5px var(--btn-hi); }
.chip.ok { color: var(--ok); background: var(--ok-soft); }

/* shell */
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(110px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark {
  width: 44px; height: 44px; border-radius: 15px; flex: none; display: grid; place-items: center;
  background: linear-gradient(150deg, var(--accent-2), var(--accent));
  box-shadow: 4px 6px 12px var(--glow), inset -3px -4px 7px var(--btn-lo), inset 3px 3px 6px var(--btn-hi);
}
.mark svg { width: 24px; height: 24px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 20px; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
main { display: flex; flex-direction: column; gap: 22px; }
h2.sec { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 4px -8px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.tabs-in { pointer-events: auto; display: flex; gap: 6px; padding: 8px; width: 100%; max-width: 420px; border-radius: 999px; background: var(--surface);
  box-shadow: 8px 10px 22px var(--sh-dark), -6px -6px 14px var(--sh-light), inset -4px -4px 8px var(--in-dark), inset 4px 4px 8px var(--in-light); }
.tab { flex: 1; min-height: 50px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 800; font-size: 13px; color: var(--muted); }
.tab svg { width: 20px; height: 20px; }
.tab[aria-current="page"] { color: var(--on-accent); background: linear-gradient(150deg, var(--accent-2), var(--accent));
  box-shadow: 3px 5px 10px var(--glow), inset -3px -3px 6px var(--btn-lo), inset 3px 3px 6px var(--btn-hi); }

/* today */
.hero { padding: 22px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.hero .eyebrow { display: flex; gap: 8px; flex-wrap: wrap; }
.hero h3 { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 11vw, 46px); line-height: 1; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.hero .focus { font-weight: 800; font-size: 17px; margin: -4px 0 0; }
.hero .meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-weight: 700; font-size: 13px; }
.blob { position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--accent-2), var(--accent));
  box-shadow: inset -12px -14px 26px var(--btn-lo), inset 12px 12px 22px var(--btn-hi); opacity: .9; }
.hero > :not(.blob) { position: relative; }
.ex-preview { display: flex; flex-wrap: wrap; gap: 6px; }
.ex-preview span { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--bg); color: var(--ink);
  box-shadow: inset 2px 2px 4px var(--in-dark), inset -2px -2px 4px var(--in-light); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 16px 14px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--muted); }
.wd b { width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-size: 12px; color: var(--muted);
  background: var(--bg); box-shadow: inset 3px 3px 6px var(--in-dark), inset -3px -3px 6px var(--in-light); }
.wd.done b { color: var(--on-accent); background: linear-gradient(150deg, var(--accent-2), var(--accent)); box-shadow: 2px 4px 8px var(--glow), inset -2px -3px 5px var(--btn-lo), inset 2px 2px 5px var(--btn-hi); }
.wd.today { color: var(--ink); }

.day-row { display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 16px; border-radius: var(--r-md); }
.day-badge { width: 52px; height: 52px; flex: none; border-radius: 18px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 18px;
  background: var(--raise); box-shadow: 3px 4px 8px var(--sh-dark), -3px -3px 7px var(--sh-light), inset -2px -3px 5px var(--in-dark), inset 2px 2px 5px var(--in-light); color: var(--accent); }
.day-row .txt { flex: 1; min-width: 0; }
.day-row .txt strong { display: block; font-weight: 800; font-size: 16px; }
.day-row .txt span { font-size: 13px; color: var(--muted); font-weight: 600; }

.sess-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-md); text-align: left; width: 100%; }
.date-pill { width: 52px; flex: none; text-align: center; padding: 6px 0; border-radius: 16px; background: var(--bg); box-shadow: inset 3px 3px 6px var(--in-dark), inset -3px -3px 6px var(--in-light); }
.date-pill b { display: block; font-family: var(--font-display); font-size: 18px; line-height: 1.1; }
.date-pill small { font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.sess-card .txt { flex: 1; min-width: 0; }
.sess-card strong { display: block; font-weight: 800; }
.sess-card span { font-size: 13px; color: var(--muted); font-weight: 600; }

.empty { padding: 26px 22px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty h3 { font-family: var(--font-display); margin: 0; font-size: 20px; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.note { font-size: 12px; color: var(--muted); text-align: center; font-weight: 600; }
.banner { padding: 14px 16px; border-radius: var(--r-md); display: flex; gap: 12px; align-items: center; }
.banner .txt { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; }

/* stats + chart */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { padding: 14px 12px; border-radius: var(--r-md); text-align: center; }
.stat b { display: block; font-family: var(--font-display); font-size: 22px; line-height: 1.15; }
.stat small { font-size: 11px; color: var(--muted); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.chart-card { padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.chart-card select { width: 100%; padding: 12px 14px; border: 0; font-weight: 800; appearance: none; border-radius: var(--r-sm); background: var(--bg);
  box-shadow: inset 3px 3px 7px var(--in-dark), inset -3px -3px 7px var(--in-light); }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.chart-wrap .ax { fill: var(--muted); font-size: 10px; font-family: var(--font-body); font-weight: 700; }

/* overlays */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.sheet-in { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(150px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.sheet-head { position: sticky; top: 0; z-index: 5; margin: 0 -4px; padding: 10px 4px 12px; background: var(--bg); display: flex; align-items: center; gap: 12px; }
.sheet-head .t { flex: 1; min-width: 0; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-head p { margin: 0; font-size: 13px; color: var(--muted); font-weight: 700; }

.ex { padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ex-head h3 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.25; }
.ex-head .sub { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.ex-last { font-size: 12px; font-weight: 700; color: var(--muted); padding: 8px 12px; border-radius: 12px; background: var(--bg); box-shadow: inset 2px 2px 5px var(--in-dark), inset -2px -2px 5px var(--in-light); }
.ex-last.tip { color: var(--accent); }
.sets { display: flex; flex-direction: column; gap: 8px; }
.set-labels, .set { display: grid; grid-template-columns: 22px minmax(0, 1.25fr) minmax(0, 1fr) 46px; gap: 8px; align-items: center; }
.set-labels { font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.set-labels span:nth-child(2), .set-labels span:nth-child(3) { text-align: center; }
.set .n { font-family: var(--font-display); font-size: 13px; color: var(--muted); text-align: center; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 2px; padding: 4px; border-radius: 14px; background: var(--bg);
  box-shadow: inset 3px 3px 6px var(--in-dark), inset -3px -3px 6px var(--in-light); min-width: 0; }
.stepper button { width: 30px; height: 34px; border-radius: 10px; font-weight: 800; font-size: 17px; color: var(--muted); flex: none; }
.stepper button:active { color: var(--accent); }
.stepper input { width: 100%; min-width: 0; text-align: center; border: 0; background: transparent; font-weight: 800; font-size: 16px; padding: 0; font-variant-numeric: tabular-nums; }
.stepper.bw { justify-content: center; font-size: 12px; font-weight: 800; color: var(--muted); min-height: 42px; }
.check { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; color: var(--muted);
  background: var(--surface); box-shadow: 3px 4px 8px var(--sh-dark), -3px -3px 6px var(--sh-light), inset -2px -2px 5px var(--in-dark), inset 2px 2px 5px var(--in-light); }
.check svg { width: 22px; height: 22px; }
.set.done .check { color: #fff; background: linear-gradient(150deg, var(--ok), var(--ok)); box-shadow: 2px 4px 9px var(--sh-dark), inset -3px -3px 6px var(--btn-lo), inset 3px 3px 6px var(--btn-hi); }
.set.done .stepper input { color: var(--ok); }
.ex-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.ex.complete .ex-head h3::after { content: " ✓"; color: var(--ok); }

.weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.weeks button { min-height: 58px; border-radius: 16px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  background: var(--bg); box-shadow: inset 3px 3px 6px var(--in-dark), inset -3px -3px 6px var(--in-light); color: var(--muted); }
.weeks button small { font-size: 10px; font-weight: 700; }
.weeks button[aria-pressed="true"] { color: var(--on-accent); background: linear-gradient(150deg, var(--accent-2), var(--accent)); box-shadow: 2px 4px 9px var(--glow), inset -3px -3px 6px var(--btn-lo), inset 3px 3px 6px var(--btn-hi); }

/* rest bar */
.rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; justify-content: center;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.rest-in { width: 100%; max-width: 540px; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 28px; background: var(--raise);
  box-shadow: 0 -2px 30px var(--sh-dark), inset -4px -4px 9px var(--in-dark), inset 4px 4px 9px var(--in-light); }
.ring { width: 64px; height: 64px; flex: none; position: relative; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring .trk { stroke: var(--track); }
.ring .bar { stroke: var(--accent); transition: stroke-dashoffset .25s linear; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.rest .txt { flex: 1; min-width: 0; }
.rest .txt strong { display: block; font-weight: 800; }
.rest .txt span { font-size: 12px; color: var(--muted); font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rest .ctl { display: flex; gap: 6px; }

/* run timer */
.run { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; overflow-y: auto; }
.run-in { flex: 1; max-width: 520px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); }
.run-face { padding: 26px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.run-face .phase { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.run-face .phase.sprint { color: var(--accent); }
.run-face .phase.walk, .run-face .phase.cool { color: var(--ok); }
.run-face .clock { font-family: var(--font-display); font-weight: 800; font-size: clamp(64px, 24vw, 104px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.run-face .speed { font-weight: 800; font-size: 20px; }
.prog { height: 14px; border-radius: 99px; background: var(--bg); box-shadow: inset 3px 3px 6px var(--in-dark), inset -3px -3px 6px var(--in-light); overflow: hidden; width: 100%; }
.prog i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.run-next { padding: 14px 16px; border-radius: var(--r-md); display: flex; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 14px; }
.run-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }

function startDb(db) {

  const onErr = (e) => { console.error(e); clearTimeout(timer); S.slow = true; S.loaded = true; renderMain(); };

    body = `<div class="sheet-head"><button class="icon-btn" data-act="ed-cancel" aria-label="Close without saving">✕</button><div class="t"><h2>${E.isNew ? 'New split' : 'Edit split'}</h2><p>${sp.days.length} days</p></div><button class="btn hot sm" data-act="ed-save">Save</button></div>
    ${E.err ? `<p class="err">${h(E.err)}</p>` : ''}
    <section class="clay card"><div class="field"><label for="sp-name">Split name</label><input id="sp-name" data-bind="sp.name" value="${h(sp.name)}" placeholder="e.g. Push Pull Legs"></div></section>
    <h2 class="sec">Days</h2>
    <div class="stack">${sp.days.map((d, i) => `<div class="clay row-item"><div class="day-badge" style="width:44px;height:44px;font-size:15px">${h(dayShort(d))}</div>
      <div class="txt"><strong>${h(d.name || 'Untitled day')}</strong><span>${h(d.focus || '')}${d.focus ? ' · ' : ''}${d.exercises.length} exercises</span></div>
      <button class="btn sm" data-act="ed-day" data-d="${i}">Edit</button></div>`).join('')}</div>
    <button class="btn block" data-act="ed-add-day">+ Add day</button>
    <h2 class="sec">Rotation</h2>
    <section class="clay card"><p class="small muted" style="margin:0;font-weight:700">The order you train in. Tap a day below to add it, tap it in the row to remove it. The Train tab follows this order.</p>
      <div class="rot">${(sp.rotation || []).length ? sp.rotation.map((r, i) => `<button data-act="ed-rot-del" data-i="${i}" class="${r === 'rest' ? 'rest-c' : ''}" aria-label="Remove">${r === 'rest' ? 'Rest' : h((findDay(sp, r) || { name: '?' }).name)} ✕</button>`).join('') : '<span class="small muted" style="font-weight:700;align-self:center">No rotation yet</span>'}</div>
      <div class="seg">${sp.days.map(d => `<button data-act="ed-rot-add" data-id="${h(d.id)}">+ ${h(d.name)}</button>`).join('')}<button data-act="ed-rot-add" data-id="rest">+ Rest</button></div></section>
    ${E.isNew ? '' : `<button class="btn ghost danger" data-act="ed-del-split">Delete this split</button>`}`;
  } else if (E.view === 'day') {
    const d = sp.days[E.d];
    body = `<div class="sheet-head"><button class="icon-btn" data-act="ed-back" aria-label="Back to split">‹</button><div class="t"><h2>${h(d.name || 'Day')}</h2><p>${h(sp.name || 'Split')}</p></div><button class="btn hot sm" data-act="ed-back">Done</button></div>
    <section class="clay card"><div class="grid2"><div class="field"><label for="day-name">Day name</label><input id="day-name" data-bind="day.name" value="${h(d.name)}" placeholder="Day A"></div>
      <div class="field"><label for="day-focus">Focus</label><input id="day-focus" data-bind="day.focus" value="${h(d.focus || '')}" placeholder="Quads + Push"></div></div></section>
    <h2 class="sec">Exercises</h2>
    <div class="stack">${d.exercises.length ? d.exercises.map((x, i) => `<div class="clay row-item">
      <div class="txt"><strong>${h(x.name || 'Untitled')}</strong><span class="num">${x.kind === 'treadmill' ? 'Treadmill HIIT plan' : `${x.sets} × ${x.reps} · ${wLabel(x.weight, x.mode)} · rest ${mmss(x.rest)}`}</span></div>
      <button class="icon-btn" data-act="ed-ex-up" data-x="${i}" aria-label="Move up" ${i === 0 ? 'disabled style="opacity:.35"' : ''}>↑</button>
      <button class="icon-btn" data-act="ed-ex" data-x="${i}" aria-label="Edit ${h(x.name)}">✎</button></div>`).join('') : '<div class="clay empty"><p>No exercises on this day yet.</p></div>'}</div>
    <button class="btn hot block" data-act="ed-add-ex">+ Add exercise</button>
    <button class="btn ghost danger" data-act="ed-del-day">Delete this day</button>`;
  } else {
    const x = sp.days[E.d].exercises[E.x];
    const tread = x.kind === 'treadmill';
    body = `<div class="sheet-head"><button class="icon-btn" data-act="ed-ex-done" aria-label="Back to day">‹</button><div class="t"><h2>${h(x.name || 'New exercise')}</h2><p>${h(sp.days[E.d].name)}</p></div><button class="btn hot sm" data-act="ed-ex-done">Done</button></div>
    ${E.err ? `<p class="err">${h(E.err)}</p>` : ''}
    <section class="clay card">
      <div class="field"><label for="ex-name">Exercise name</label><input id="ex-name" data-bind="ex.name" value="${h(x.name)}" placeholder="e.g. Incline Dumbbell Press"></div>
      <div class="field"><span class="lab">Type</span><div class="seg" role="group" aria-label="Type">
        ${[['kg', 'Weight (kg)'], ['plus', 'Machine +kg'], ['bw', 'Bodyweight'], ['treadmill', 'Treadmill HIIT']].map(([m, l]) => `<button data-act="ed-mode" data-mode="${m}" aria-pressed="${tread ? m === 'treadmill' : (x.mode === m)}">${l}</button>`).join('')}</div>
        ${x.mode === 'plus' && !tread ? '<p class="small muted" style="margin:4px 4px 0;font-weight:700">Log only the plates you add on top of the machine’s own weight.</p>' : ''}</div>
      ${tread ? '<p class="small muted" style="margin:0;font-weight:700">Runs your 4-week treadmill plan with a phase-by-phase interval timer. The week is picked during the workout.</p>' : `
      <div class="grid3"><div class="field"><label for="ex-sets">Sets</label><input id="ex-sets" inputmode="numeric" data-bind="ex.sets" value="${x.sets}"></div>
        <div class="field"><label for="ex-reps">Reps</label><input id="ex-reps" inputmode="numeric" data-bind="ex.reps" value="${x.reps}"></div>
        <div class="field"><label for="ex-weight">${x.mode === 'plus' ? '+kg' : 'kg'}</label><input id="ex-weight" inputmode="decimal" data-bind="ex.weight" value="${num(x.weight)}" ${x.mode === 'bw' ? 'disabled' : ''}></div></div>
      <div class="field"><span class="lab">Rest between sets</span><div class="seg" role="group" aria-label="Rest">${[45, 60, 90, 120, 150, 180].map(s => `<button data-act="ed-rest" data-s="${s}" aria-pressed="${x.rest === s}">${mmss(s)}</button>`).join('')}</div></div>`}
      <div class="field"><label for="ex-note">Note</label><input id="ex-note" data-bind="ex.note" value="${h(x.note || '')}" placeholder="Seat height, grip, tempo…"></div>
    </section>
    <button class="btn ghost danger" data-act="ed-del-ex">Remove this exercise</button>`;
  }
  $('#editor').innerHTML = `<div class="sheet-in">${body}</div>`;
}
function bindInput(el) {
  const E = S.edit; if (!E) return; const [scope, key] = el.dataset.bind.split('.');
  let v = el.value;
  if (scope === 'sp') E.sp[key] = v;
  else if (scope === 'day') E.sp.days[E.d][key] = v;
  else { const x = E.sp.days[E.d].exercises[E.x]; if (['sets', 'reps'].includes(key)) v = Math.max(1, Math.min(50, parseInt(v, 10) || 1)); if (key === 'weight') v = Math.max(0, parseFloat(String(v).replace(',', '.')) || 0); x[key] = v; }
}

/* ---------- own GIF upload ---------- */
async function uploadGif(input) {
  const f = input.files && input.files[0]; const a = S.active; if (!f || !a || !ASSETS) return;
  if (f.size > 20 * 1024 * 1024) { toast('That file is over 20 MB. Pick a smaller GIF.'); return; }
  const e = a.exercises[+input.dataset.ex]; if (!e) return;
  toast('Uploading your GIF…');
  try {
    const r = await ASSETS.upload(f);
    e.media = { id: r.id, url: r.url }; saveDraft();
    const sp = S.splits.find(x => x.id === a.splitId);
    if (sp) { const copy = clone(sp); let hit = false; copy.days.forEach(d => d.exercises.forEach(x => { if (x.id === e.exId) { x.media = { id: r.id, url: r.url }; hit = true; } })); if (hit) store.saveSplit(copy); }
    toast('GIF saved for ' + e.name); if (focusOpen()) renderFocus();
  } catch (err) { console.error(err); toast('Couldn’t upload that file. Try a GIF, PNG or JPG under 20 MB.'); }
}

/* ---------- events ---------- */
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset.bind) { bindInput(el); return; }
  if (el.id === 'chart-ex') return;
  if (el.dataset.f && S.active) {
    const e = S.active.exercises[+el.dataset.ex]; const x = e && e.sets[+el.dataset.set]; if (!x) return;
    const v = parseFloat(String(el.value).replace(',', '.'));
    if (!isNaN(v)) { x[el.dataset.f] = Math.max(0, v); saveDraft(); }
  }
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'gif-file') { uploadGif(ev.target); return; }
  if (ev.target.id === 'chart-ex') { S.chartEx = ev.target.value; renderMain(); }
  if (ev.target.dataset.bind && S.edit && S.edit.view === 'ex' && ['sets', 'reps', 'weight'].includes(ev.target.dataset.bind.split('.')[1])) renderEditor();
});
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-tab].tab'); if (!b) return;
  ensureAudio();
  if (b.classList.contains('tab')) { S.tab = b.dataset.tab; try { history.replaceState(null, '', '#' + S.tab); } catch (e) {} renderAll(); window.scrollTo(0, 0); return; }
  const act = b.dataset.act; const a = S.active; const E = S.edit;
  const exI = +b.dataset.ex, setI = +b.dataset.set;
  switch (act) {
    case 'tab': S.tab = b.dataset.tab; renderAll(); break;
    case 'load-starter': {
      if (!SEED) break;
      const base = S.splits.length; const sps = clone(SEED.splits).map((s, i) => ({ ...s, order: base + i }));
      sps.forEach(s => store.saveSplit(s));
      store.saveSettings({ ...S.settings, activeSplitId: sps[0].id, rotPos: { ...(S.settings.rotPos || {}), [sps[0].id]: 0 } });
      toast('Your A/B program is loaded'); break;
    }
    case 'start': startWorkout(b.dataset.split, b.dataset.day); break;
    case 'resume': openSession(); break;
    case 'rest-done': { const sp = activeSplit(); if (sp) { setRot(sp, (rotPos(sp) + 1) % sp.rotation.length); toast('Rest day logged'); } break; }
    case 'activate': store.saveSettings({ ...S.settings, activeSplitId: b.dataset.id }); toast('Active split changed'); break;
    case 'open-sess': openDetail(b.dataset.id); break;
    case 'close-detail': closeDetail(); break;
    case 'go-progress': closeDetail(); S.tab = 'history'; try { history.replaceState(null, '', '#history'); } catch (e) {} renderAll(); window.scrollTo(0, 0); break;
    case 'cal-prev': case 'cal-next': { const c = S.cal || { y: new Date().getFullYear(), m: new Date().getMonth() }; let m = c.m + (act === 'cal-next' ? 1 : -1), y = c.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.cal = { y, m }; renderMain(); break; }
    case 'del-sess': confirmDlg('Delete this workout?', 'Its sets come out of your history and progress chart. This can’t be undone.', 'Delete', () => { store.deleteSession(b.dataset.id); closeDetail(); toast('Workout deleted'); }); break;

    // session
    case 'min-session': closeSession(); renderMain(); break;
    case 'view-list': S.sview = 'list'; $('#session').scrollTop = 0; renderSession(); break;
    case 'view-focus': S.sview = 'focus'; $('#session').scrollTop = 0; renderSession(); break;
    case 'f-prev': if (S.fx > 0) { S.fx--; renderFocus(); } break;
    case 'f-next': {
      if (b.closest('.big-done')) { const ni = nextWorkIndex(S.fx); S.fx = ni < 0 ? Math.min(S.fx + 1, a.exercises.length - 1) : ni; }
      else if (S.fx < a.exercises.length - 1) S.fx++;
      renderFocus(); break;
    }
    case 'f-done': {
      const e = a.exercises[S.fx]; const k = e.sets.findIndex(x => !x.done); if (k < 0) break;
      const x = e.sets[k]; x.done = true; x.t = Date.now(); e.t0 = e.t0 || x.t; e.t1 = x.t; saveDraft();
      buzz(40); beep(1320, .07);
      if (e.sets.some(y => !y.done)) { const nx = e.sets.find(y => !y.done); startRest(e.rest, e.name, `${e.name} · set ${k + 2} · ${e.mode === 'bw' ? '' : wLabel(nx.w, e.mode) + ' × '}${nx.r}`); }
      else {
        const ni = nextWorkIndex(S.fx);
        if (ni < 0) { renderFocus(); toast('All sets done. Tap Finish.'); break; }
        S.fx = ni; startRest(e.rest, e.name, a.exercises[ni].name);
      }
      break;
    }
    case 'gif-clear': {
      const e = a.exercises[exI]; delete e.media; saveDraft();
      const sp = S.splits.find(x => x.id === a.splitId); const ex = sp && sp.days.flatMap(d => d.exercises).find(x => x.id === e.exId);
      if (ex && ex.media) { const copy = clone(sp); copy.days.forEach(d => d.exercises.forEach(x => { if (x.id === e.exId) delete x.media; })); store.saveSplit(copy); }
      renderFocus(); break;
    }
    case 'finish': finishWorkout(false); break;
    case 'discard': confirmDlg('Discard this workout?', 'Nothing from this session will be saved.', 'Discard', () => { S.active = null; saveDraft(); closeSession(); renderMain(); toast('Workout discarded'); }); break;
    case 'step': {
      const x = a.exercises[exI].sets[setI]; const d = parseFloat(b.dataset.d);
      x[b.dataset.f] = Math.max(0, Math.round(((Number(x[b.dataset.f]) || 0) + d) * 100) / 100);
      const inp = document.getElementById(`${b.dataset.f}-${exI}-${setI}`); if (inp) inp.value = num(x[b.dataset.f]); saveDraft(); break;
    }
    case 'toggle-set': {
      const e = a.exercises[exI]; const x = e.sets[setI]; x.done = !x.done; x.t = x.done ? Date.now() : null; if (x.done) { e.t0 = e.t0 || Date.now(); e.t1 = Date.now(); } saveDraft(); renderSession();
      if (x.done) {
        buzz(30);
        const moreHere = e.sets.some(s => !s.done);
        const nextEx = a.exercises.slice(exI + 1).find(ne => ne.kind === 'treadmill' ? !(ne.run && ne.run.done) : ne.sets.some(s => !s.done));
        const allDone = !moreHere && !nextEx && a.exercises.every(ne => ne.kind === 'treadmill' ? ne.run && ne.run.done : ne.sets.every(s => s.done));
        if (allDone) toast('Every set done. Tap Finish to save.');
        else startRest(e.rest, e.name, moreHere ? `${e.name}, set ${e.sets.findIndex(s => !s.done) + 1}` : (nextEx ? nextEx.name : ''));
        if (!moreHere && nextEx) { const ni = a.exercises.indexOf(nextEx); setTimeout(() => { const el = document.getElementById('ex-' + ni); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 120); }
      }
      break;
    }
    case 'add-set': { const e = a.exercises[exI]; const l = e.sets[e.sets.length - 1] || { w: 0, r: e.targetReps }; e.sets.push({ w: l.w, r: l.r, done: false }); saveDraft(); renderSession(); break; }
    case 'del-set': { const e = a.exercises[exI]; if (e.sets.length > 1) e.sets.pop(); saveDraft(); renderSession(); break; }
    case 'rest-now': { const e = a.exercises[exI]; startRest(e.rest, e.name); break; }
    case 'add-ex-mode': S.addMode = b.dataset.mode; document.querySelectorAll('[data-act="add-ex-mode"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.mode === S.addMode)); break;
    case 'add-ex': {
      const inp = $('#add-ex-name'); const name = (inp.value || '').trim(); if (!name) { inp.focus(); toast('Type the exercise name first'); break; }
      const mode = S.addMode || 'kg';
      a.exercises.push({ exId: 'x-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-'), name, kind: 'lift', mode, rest: 90, targetReps: 10, targetSets: 3, note: '', sets: [0, 1, 2].map(() => ({ w: 0, r: 10, done: false })) });
      saveDraft(); renderSession(); const el = document.getElementById('ex-' + (a.exercises.length - 1)); if (el) el.scrollIntoView({ behavior: 'smooth' }); break;
    }
    case 'run-week': a.exercises[exI].run.week = +b.dataset.week; saveDraft(); renderSession(); break;
    case 'run-start': openRun(exI); break;
    case 'run-mark': { const e = a.exercises[exI]; e.run.done = true; e.t0 = e.t0 || Date.now(); e.t1 = Date.now(); saveDraft(); renderSession(); break; }
    case 'run-toggle':
      if (RUN.paused) { RUN.paused = false; RUN.end = Date.now() + RUN.left * 1000; clearInterval(RUN.iv); RUN.iv = setInterval(runTick, 200); if (RUN.idx === 0) beep(880, .2, 2); }
      else { RUN.left = Math.max(0, (RUN.end - Date.now()) / 1000); RUN.paused = true; clearInterval(RUN.iv); }
      drawRun(); break;
    case 'run-skip': nextPhase(); break;
    case 'run-close':
      if (RUN.idx === 0 && RUN.paused) { clearInterval(RUN.iv); $('#run').hidden = true; break; }
      confirmDlg('Stop the run?', 'The timer stops and this run isn’t marked done.', 'Stop run', () => { clearInterval(RUN.iv); RUN.paused = true; $('#run').hidden = true; renderSession(); }); break;
    case 'rest-adj': REST.end += (+b.dataset.d) * 1000; REST.total = Math.max(REST.total + (+b.dataset.d), 1); if (REST.end <= Date.now()) stopRest(false); else drawRest(); break;
    case 'rest-skip': stopRest(false); break;
    case 'dlg-no': $('#dlg').hidden = true; dlgCb = null; break;
    case 'dlg-yes': { $('#dlg').hidden = true; const cb = dlgCb; dlgCb = null; cb && cb(); break; }

    // editor
    case 'new-split': openEditor({ id: uid(), name: '', order: S.splits.length, rotation: [], days: [{ id: uid(), name: 'Day 1', focus: '', exercises: [] }] }, true); break;
    case 'edit-split': { const sp = S.splits.find(s => s.id === b.dataset.id); if (sp) openEditor(sp, false); break; }
    case 'ed-cancel': closeEditor(); break;
    case 'ed-save': {
      const sp = E.sp; sp.name = (sp.name || '').trim();
      if (!sp.name) { E.err = 'Give the split a name.'; renderEditor(); break; }
      if (!sp.days.length) { E.err = 'Add at least one day.'; renderEditor(); break; }
      sp.days.forEach(d => { d.name = (d.name || '').trim() || 'Untitled day'; d.exercises = d.exercises.filter(x => (x.name || '').trim()); });
      store.saveSplit(clone(sp));
      if (!S.settings.activeSplitId || !S.splits.some(s => s.id === S.settings.activeSplitId)) store.saveSettings({ ...S.settings, activeSplitId: sp.id });
      closeEditor(); toast('Split saved'); break;
    }
    case 'ed-del-split': confirmDlg('Delete this split?', 'Your logged workouts stay in Progress. The split’s days and exercises are removed.', 'Delete split', () => {
      const id = E.sp.id; store.deleteSplit(id); if (S.settings.activeSplitId === id) store.saveSettings({ ...S.settings, activeSplitId: (S.splits[0] || {}).id || null }); closeEditor(); toast('Split deleted'); }); break;
    case 'ed-add-day': { const n = E.sp.days.length; E.sp.days.push({ id: uid(), name: 'Day ' + String.fromCharCode(65 + n), focus: '', exercises: [] }); E.d = n; E.view = 'day'; E.err = ''; renderEditor(); break; }
    case 'ed-day': E.d = +b.dataset.d; E.view = 'day'; E.err = ''; renderEditor(); document.getElementById('editor').scrollTop = 0; break;
    case 'ed-back': E.view = 'split'; renderEditor(); break;
    case 'ed-del-day': confirmDlg('Delete this day?', 'It’s removed from the split and its rotation when you save.', 'Delete day', () => {
      const id = E.sp.days[E.d].id; E.sp.days.splice(E.d, 1); E.sp.rotation = (E.sp.rotation || []).filter(r => r !== id); E.view = 'split'; renderEditor(); }); break;
    case 'ed-rot-add': E.sp.rotation = [...(E.sp.rotation || []), b.dataset.id]; renderEditor(); break;
    case 'ed-rot-del': E.sp.rotation.splice(+b.dataset.i, 1); renderEditor(); break;
    case 'ed-add-ex': { const d = E.sp.days[E.d]; d.exercises.push(blankEx()); E.x = d.exercises.length - 1; E.view = 'ex'; E.err = ''; renderEditor(); setTimeout(() => { const i = $('#ex-name'); i && i.focus(); }, 50); break; }
    case 'ed-ex': E.x = +b.dataset.x; E.view = 'ex'; E.err = ''; renderEditor(); document.getElementById('editor').scrollTop = 0; break;
    case 'ed-ex-up': { const xs = E.sp.days[E.d].exercises; const i = +b.dataset.x; if (i > 0) { [xs[i - 1], xs[i]] = [xs[i], xs[i - 1]]; renderEditor(); } break; }
    case 'ed-mode': { const x = E.sp.days[E.d].exercises[E.x]; const m = b.dataset.mode; if (m === 'treadmill') { x.kind = 'treadmill'; x.mode = 'bw'; if (!x.name) x.name = 'Stamina Challenge'; } else { x.kind = 'lift'; x.mode = m; } renderEditor(); break; }
    case 'ed-rest': E.sp.days[E.d].exercises[E.x].rest = +b.dataset.s; renderEditor(); break;
    case 'ed-ex-done': { const x = E.sp.days[E.d].exercises[E.x]; if (!(x.name || '').trim()) { E.err = 'Give the exercise a name, or remove it.'; renderEditor(); break; } x.name = x.name.trim(); E.err = ''; E.view = 'day'; renderEditor(); break; }
    case 'ed-del-ex': E.sp.days[E.d].exercises.splice(E.x, 1); E.err = ''; E.view = 'day'; renderEditor(); break;
  }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && !$('#dlg').hidden) { $('#dlg').hidden = true; dlgCb = null; }
  if (ev.key === 'Enter' && ev.target.id === 'add-ex-name') { ev.preventDefault(); $('[data-act="add-ex"]').click(); }
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (['today', 'splits', 'history'].includes(t) && t !== S.tab) { S.tab = t; renderAll(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.active && !$('#session').hidden) { try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {} } });

boot();
})();
</script>
